openapi: 3.1.0
info:
  title: Workday Financials Workday Cash Management Account Reconciliations Cash Positions API
  description: API for managing cash positions, bank accounts, transactions, and cash forecasting within Workday Cash Management.
  version: v38.2
  contact:
    name: Workday Support
    url: https://www.workday.com/en-us/company/latest/support.html
  termsOfService: https://www.workday.com/en-us/legal.html
servers:
- url: https://{tenant}.workday.com/api/cashManagement/v38.2
  description: Workday Cash Management Production
  variables:
    tenant:
      description: Workday tenant identifier
      default: your-tenant
security:
- bearerAuth: []
tags:
- name: Cash Positions
  description: View and manage cash positions
paths:
  /cashPositions:
    get:
      operationId: listCashPositions
      summary: Workday Financials List cash positions
      description: Retrieve current cash positions across bank accounts.
      tags:
      - Cash Positions
      parameters:
      - $ref: '#/components/parameters/limit'
      - $ref: '#/components/parameters/offset'
      - name: asOfDate
        in: query
        description: Cash position as of this date
        schema:
          type: string
          format: date
      responses:
        '200':
          description: Cash positions retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  total:
                    type: integer
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/CashPosition'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /cashPositions/{id}:
    get:
      operationId: getCashPosition
      summary: Workday Financials Get a cash position
      description: Retrieve details of a specific cash position.
      tags:
      - Cash Positions
      parameters:
      - $ref: '#/components/parameters/resourceId'
      responses:
        '200':
          description: Cash position details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CashPosition'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
components:
  schemas:
    BankAccountRef:
      type: object
      properties:
        id:
          type: string
          description: Workday ID of the bank account
        descriptor:
          type: string
          description: Display name of the bank account
    CurrencyRef:
      type: object
      properties:
        id:
          type: string
          description: Workday ID of the currency
        descriptor:
          type: string
          description: Currency code (e.g., USD, EUR)
    CashPosition:
      type: object
      properties:
        id:
          type: string
          description: Workday ID (WID) for the cash position
        bankAccount:
          $ref: '#/components/schemas/BankAccountRef'
        asOfDate:
          type: string
          format: date
          description: Date of the cash position
        openingBalance:
          type: number
          format: double
          description: Opening balance for the period
        closingBalance:
          type: number
          format: double
          description: Closing balance for the period
        totalInflows:
          type: number
          format: double
          description: Total cash inflows
        totalOutflows:
          type: number
          format: double
          description: Total cash outflows
        currency:
          $ref: '#/components/schemas/CurrencyRef'
  parameters:
    offset:
      name: offset
      in: query
      description: Number of results to skip for pagination
      schema:
        type: integer
        default: 0
    resourceId:
      name: id
      in: path
      required: true
      description: Unique identifier of the resource (WID)
      schema:
        type: string
    limit:
      name: limit
      in: query
      description: Maximum number of results to return
      schema:
        type: integer
        default: 20
        maximum: 100
  responses:
    Unauthorized:
      description: Authentication credentials are missing or invalid
    NotFound:
      description: The requested resource was not found
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: OAuth 2.0 bearer token obtained from Workday authentication
externalDocs:
  description: Workday Cash Management API Documentation
  url: https://community.workday.com/sites/default/files/file-hosting/productionapi/index.html
