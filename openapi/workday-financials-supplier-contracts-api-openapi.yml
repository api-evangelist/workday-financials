openapi: 3.1.0
info:
  title: Workday Financials Workday Cash Management Account Reconciliations Supplier Contracts API
  description: API for managing cash positions, bank accounts, transactions, and cash forecasting within Workday Cash Management.
  version: v38.2
  contact:
    name: Workday Support
    url: https://www.workday.com/en-us/company/latest/support.html
  termsOfService: https://www.workday.com/en-us/legal.html
servers:
- url: https://{tenant}.workday.com/api/cashManagement/v38.2
  description: Workday Cash Management Production
  variables:
    tenant:
      description: Workday tenant identifier
      default: your-tenant
security:
- bearerAuth: []
tags:
- name: Supplier Contracts
  description: Manage supplier contracts
paths:
  /supplierContracts:
    get:
      operationId: listSupplierContracts
      summary: Workday Financials List supplier contracts
      description: Retrieve a collection of supplier contracts.
      tags:
      - Supplier Contracts
      parameters:
      - $ref: '#/components/parameters/limit'
      - $ref: '#/components/parameters/offset'
      responses:
        '200':
          description: Supplier contracts retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  total:
                    type: integer
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/SupplierContract'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /supplierContracts/{id}:
    get:
      operationId: getSupplierContract
      summary: Workday Financials Get a supplier contract
      description: Retrieve details of a specific supplier contract.
      tags:
      - Supplier Contracts
      parameters:
      - $ref: '#/components/parameters/resourceId'
      responses:
        '200':
          description: Supplier contract details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SupplierContract'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
components:
  parameters:
    limit:
      name: limit
      in: query
      description: Maximum number of results to return
      schema:
        type: integer
        default: 20
        maximum: 100
    offset:
      name: offset
      in: query
      description: Number of results to skip for pagination
      schema:
        type: integer
        default: 0
    resourceId:
      name: id
      in: path
      required: true
      description: Unique identifier of the resource (WID)
      schema:
        type: string
  responses:
    Unauthorized:
      description: Authentication credentials are missing or invalid
    NotFound:
      description: The requested resource was not found
  schemas:
    SupplierContract:
      type: object
      properties:
        id:
          type: string
          description: Workday ID (WID) for the supplier contract
        contractNumber:
          type: string
          description: Contract reference number
        supplier:
          $ref: '#/components/schemas/SupplierShortRef'
        startDate:
          type: string
          format: date
          description: Contract start date
        endDate:
          type: string
          format: date
          description: Contract end date
        totalAmount:
          type: number
          format: double
          description: Total contract value
        status:
          type: string
          enum:
          - Draft
          - Active
          - Expired
          - Canceled
          description: Current contract status
    SupplierShortRef:
      type: object
      properties:
        id:
          type: string
          description: Workday ID of the supplier
        descriptor:
          type: string
          description: Display name of the supplier
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: OAuth 2.0 bearer token obtained from Workday authentication
externalDocs:
  description: Workday Cash Management API Documentation
  url: https://community.workday.com/sites/default/files/file-hosting/productionapi/index.html
