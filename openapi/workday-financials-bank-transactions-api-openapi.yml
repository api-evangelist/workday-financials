openapi: 3.1.0
info:
  title: Workday Financials Workday Cash Management Account Reconciliations Bank Transactions API
  description: API for managing cash positions, bank accounts, transactions, and cash forecasting within Workday Cash Management.
  version: v38.2
  contact:
    name: Workday Support
    url: https://www.workday.com/en-us/company/latest/support.html
  termsOfService: https://www.workday.com/en-us/legal.html
servers:
- url: https://{tenant}.workday.com/api/cashManagement/v38.2
  description: Workday Cash Management Production
  variables:
    tenant:
      description: Workday tenant identifier
      default: your-tenant
security:
- bearerAuth: []
tags:
- name: Bank Transactions
  description: Access and manage bank transactions
paths:
  /bankAccounts/{id}/transactions:
    get:
      operationId: listBankTransactions
      summary: Workday Financials List bank transactions for an account
      description: Retrieve bank transactions associated with a specific bank account.
      tags:
      - Bank Transactions
      parameters:
      - $ref: '#/components/parameters/resourceId'
      - $ref: '#/components/parameters/limit'
      - $ref: '#/components/parameters/offset'
      - name: fromDate
        in: query
        description: Filter transactions from this date
        schema:
          type: string
          format: date
      - name: toDate
        in: query
        description: Filter transactions to this date
        schema:
          type: string
          format: date
      responses:
        '200':
          description: Bank transactions retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  total:
                    type: integer
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/BankTransaction'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
components:
  parameters:
    offset:
      name: offset
      in: query
      description: Number of results to skip for pagination
      schema:
        type: integer
        default: 0
    resourceId:
      name: id
      in: path
      required: true
      description: Unique identifier of the resource (WID)
      schema:
        type: string
    limit:
      name: limit
      in: query
      description: Maximum number of results to return
      schema:
        type: integer
        default: 20
        maximum: 100
  schemas:
    BankTransaction:
      type: object
      properties:
        id:
          type: string
          description: Workday ID (WID) for the transaction
        transactionDate:
          type: string
          format: date
          description: Date of the transaction
        description:
          type: string
          description: Transaction description
        amount:
          type: number
          format: double
          description: Transaction amount
        transactionType:
          type: string
          enum:
          - Debit
          - Credit
          description: Type of transaction
        status:
          type: string
          enum:
          - Pending
          - Cleared
          - Reconciled
          description: Transaction status
        referenceNumber:
          type: string
          description: External reference number
  responses:
    Unauthorized:
      description: Authentication credentials are missing or invalid
    NotFound:
      description: The requested resource was not found
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: OAuth 2.0 bearer token obtained from Workday authentication
externalDocs:
  description: Workday Cash Management API Documentation
  url: https://community.workday.com/sites/default/files/file-hosting/productionapi/index.html
