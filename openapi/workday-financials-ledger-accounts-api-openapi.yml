openapi: 3.2.0
info:
  title: Workday Financials Workday Financial Management Ledger…
  description: Core API for managing financial transactions, general ledger, accounts payable, accounts receivable, and financial reporting within Workday Financial Management.
  version: v38.2
  contact:
    name: Workday Support
    url: https://www.workday.com/en-us/company/latest/support.html
  termsOfService: https://www.workday.com/en-us/legal.html
servers:
- url: https://{tenant}.workday.com/api/financialManagement/v38.2
  description: Workday Financial Management Production
  variables:
    tenant:
      description: Workday tenant identifier
      default: your-tenant
security:
- bearerAuth: []
tags:
- name: Ledger Accounts
  description: Manage general ledger accounts and chart of accounts
paths:
  /ledgerAccounts:
    get:
      operationId: listLedgerAccounts
      summary: Workday Financials List ledger accounts
      description: Retrieve a collection of ledger accounts from the chart of accounts.
      tags:
      - Ledger Accounts
      parameters:
      - $ref: '#/components/parameters/limit'
      - $ref: '#/components/parameters/offset'
      responses:
        '200':
          description: Ledger accounts retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  total:
                    type: integer
                    description: Total number of results
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/LedgerAccount'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /ledgerAccounts/{id}:
    get:
      operationId: getLedgerAccount
      summary: Workday Financials Get a ledger account
      description: Retrieve details of a specific ledger account by its unique identifier.
      tags:
      - Ledger Accounts
      parameters:
      - $ref: '#/components/parameters/resourceId'
      responses:
        '200':
          description: Ledger account details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LedgerAccount'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
components:
  schemas:
    CompanyRef:
      type: object
      properties:
        id:
          type: string
          description: Workday ID of the company
        descriptor:
          type: string
          description: Display name of the company
    CurrencyRef:
      type: object
      properties:
        id:
          type: string
          description: Workday ID of the currency
        descriptor:
          type: string
          description: Currency code (e.g., USD, EUR)
    LedgerAccount:
      type: object
      properties:
        id:
          type: string
          description: Workday ID (WID) for the ledger account
        accountNumber:
          type: string
          description: Account number in the chart of accounts
        accountName:
          type: string
          description: Display name of the ledger account
        accountType:
          type: string
          enum:
          - Asset
          - Liability
          - Equity
          - Revenue
          - Expense
          description: Classification type of the account
        active:
          type: boolean
          description: Whether the account is currently active
        currency:
          $ref: '#/components/schemas/CurrencyRef'
        company:
          $ref: '#/components/schemas/CompanyRef'
  parameters:
    limit:
      name: limit
      in: query
      description: Maximum number of results to return
      schema:
        type: integer
        default: 20
        maximum: 100
    offset:
      name: offset
      in: query
      description: Number of results to skip for pagination
      schema:
        type: integer
        default: 0
    resourceId:
      name: id
      in: path
      required: true
      description: Unique identifier of the resource (WID)
      schema:
        type: string
  responses:
    Unauthorized:
      description: Authentication credentials are missing or invalid
    NotFound:
      description: The requested resource was not found
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: OAuth 2.0 bearer token obtained from Workday authentication
externalDocs:
  description: Workday Financial Management API Documentation
  url: https://community.workday.com/sites/default/files/file-hosting/productionapi/index.html
