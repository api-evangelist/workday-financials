openapi: 3.1.0
info:
  title: Workday Financials Workday Cash Management Account Reconciliations Revenue Recognition API
  description: API for managing cash positions, bank accounts, transactions, and cash forecasting within Workday Cash Management.
  version: v38.2
  contact:
    name: Workday Support
    url: https://www.workday.com/en-us/company/latest/support.html
  termsOfService: https://www.workday.com/en-us/legal.html
servers:
- url: https://{tenant}.workday.com/api/cashManagement/v38.2
  description: Workday Cash Management Production
  variables:
    tenant:
      description: Workday tenant identifier
      default: your-tenant
security:
- bearerAuth: []
tags:
- name: Revenue Recognition
  description: Revenue recognition events and processing
paths:
  /revenueRecognitionEvents:
    get:
      operationId: listRevenueRecognitionEvents
      summary: Workday Financials List revenue recognition events
      description: Retrieve a collection of revenue recognition events.
      tags:
      - Revenue Recognition
      parameters:
      - $ref: '#/components/parameters/limit'
      - $ref: '#/components/parameters/offset'
      - name: fromDate
        in: query
        description: Filter events from this date
        schema:
          type: string
          format: date
      - name: toDate
        in: query
        description: Filter events to this date
        schema:
          type: string
          format: date
      responses:
        '200':
          description: Revenue recognition events retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  total:
                    type: integer
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/RevenueRecognitionEvent'
        '401':
          $ref: '#/components/responses/Unauthorized'
components:
  parameters:
    offset:
      name: offset
      in: query
      description: Number of results to skip for pagination
      schema:
        type: integer
        default: 0
    limit:
      name: limit
      in: query
      description: Maximum number of results to return
      schema:
        type: integer
        default: 20
        maximum: 100
  schemas:
    CurrencyRef:
      type: object
      properties:
        id:
          type: string
          description: Workday ID of the currency
        descriptor:
          type: string
          description: Currency code (e.g., USD, EUR)
    RevenueRecognitionEvent:
      type: object
      properties:
        id:
          type: string
          description: Workday ID (WID) for the recognition event
        revenueContract:
          $ref: '#/components/schemas/ContractRef'
        recognitionDate:
          type: string
          format: date
          description: Date revenue was recognized
        amount:
          type: number
          format: double
          description: Recognized revenue amount
        currency:
          $ref: '#/components/schemas/CurrencyRef'
        recognitionType:
          type: string
          description: Type of recognition event
    ContractRef:
      type: object
      properties:
        id:
          type: string
          description: Workday ID of the revenue contract
        descriptor:
          type: string
          description: Display name of the contract
  responses:
    Unauthorized:
      description: Authentication credentials are missing or invalid
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: OAuth 2.0 bearer token obtained from Workday authentication
externalDocs:
  description: Workday Cash Management API Documentation
  url: https://community.workday.com/sites/default/files/file-hosting/productionapi/index.html
