openapi: 3.2.0
info:
  title: Workday Financials Workday Financial Management Accounting…
  description: Core API for managing financial transactions, general ledger, accounts payable, accounts receivable, and financial reporting within Workday Financial Management.
  version: v38.2
  contact:
    name: Workday Support
    url: https://www.workday.com/en-us/company/latest/support.html
  termsOfService: https://www.workday.com/en-us/legal.html
servers:
- url: https://{tenant}.workday.com/api/financialManagement/v38.2
  description: Workday Financial Management Production
  variables:
    tenant:
      description: Workday tenant identifier
      default: your-tenant
security:
- bearerAuth: []
tags:
- name: Accounting Journals
  description: Access and manage accounting journals
paths:
  /accountingJournals:
    get:
      operationId: listAccountingJournals
      summary: Workday Financials List accounting journals
      description: Retrieve a collection of accounting journals.
      tags:
      - Accounting Journals
      parameters:
      - $ref: '#/components/parameters/limit'
      - $ref: '#/components/parameters/offset'
      responses:
        '200':
          description: Accounting journals retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  total:
                    type: integer
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/AccountingJournal'
        '401':
          $ref: '#/components/responses/Unauthorized'
components:
  schemas:
    AccountingJournal:
      type: object
      properties:
        id:
          type: string
          description: Workday ID (WID) for the accounting journal
        name:
          type: string
          description: Name of the accounting journal
        journalType:
          type: string
          description: Type of accounting journal
        active:
          type: boolean
          description: Whether the journal is active
  responses:
    Unauthorized:
      description: Authentication credentials are missing or invalid
  parameters:
    limit:
      name: limit
      in: query
      description: Maximum number of results to return
      schema:
        type: integer
        default: 20
        maximum: 100
    offset:
      name: offset
      in: query
      description: Number of results to skip for pagination
      schema:
        type: integer
        default: 0
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: OAuth 2.0 bearer token obtained from Workday authentication
externalDocs:
  description: Workday Financial Management API Documentation
  url: https://community.workday.com/sites/default/files/file-hosting/productionapi/index.html
