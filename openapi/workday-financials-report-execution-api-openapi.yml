openapi: 3.1.0
info:
  title: Workday Financials Workday Cash Management Account Reconciliations Report Execution API
  description: API for managing cash positions, bank accounts, transactions, and cash forecasting within Workday Cash Management.
  version: v38.2
  contact:
    name: Workday Support
    url: https://www.workday.com/en-us/company/latest/support.html
  termsOfService: https://www.workday.com/en-us/legal.html
servers:
- url: https://{tenant}.workday.com/api/cashManagement/v38.2
  description: Workday Cash Management Production
  variables:
    tenant:
      description: Workday tenant identifier
      default: your-tenant
security:
- bearerAuth: []
tags:
- name: Report Execution
  description: Execute reports and retrieve results
paths:
  /reports/{id}/execute:
    post:
      operationId: executeReport
      summary: Workday Financials Execute a report
      description: Execute a report with optional prompt values and retrieve results.
      tags:
      - Report Execution
      parameters:
      - $ref: '#/components/parameters/resourceId'
      - name: format
        in: query
        description: Output format for the report
        schema:
          type: string
          enum:
          - json
          - csv
          - xml
          default: json
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReportExecutionRequest'
      responses:
        '200':
          description: Report executed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportResult'
            text/csv:
              schema:
                type: string
            application/xml:
              schema:
                type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
components:
  schemas:
    ReportResult:
      type: object
      properties:
        reportName:
          type: string
          description: Name of the executed report
        executedOn:
          type: string
          format: date-time
          description: When the report was executed
        totalRows:
          type: integer
          description: Total number of rows in the result
        columns:
          type: array
          items:
            $ref: '#/components/schemas/ReportColumn'
          description: Column definitions
        rows:
          type: array
          items:
            type: object
            additionalProperties: true
          description: Report data rows
    ReportColumn:
      type: object
      properties:
        name:
          type: string
          description: Column name
        label:
          type: string
          description: Column display label
        dataType:
          type: string
          enum:
          - text
          - numeric
          - date
          - boolean
          - currency
          description: Data type of the column
    ReportExecutionRequest:
      type: object
      properties:
        prompts:
          type: object
          additionalProperties:
            type: string
          description: Key-value pairs of prompt parameter names and values
  responses:
    Unauthorized:
      description: Authentication credentials are missing or invalid
    NotFound:
      description: The requested resource was not found
    BadRequest:
      description: The request was malformed or contained invalid data
  parameters:
    resourceId:
      name: id
      in: path
      required: true
      description: Unique identifier of the resource (WID)
      schema:
        type: string
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: OAuth 2.0 bearer token obtained from Workday authentication
externalDocs:
  description: Workday Cash Management API Documentation
  url: https://community.workday.com/sites/default/files/file-hosting/productionapi/index.html
