openapi: 3.1.0
info:
  title: Workday Financials Workday Cash Management Account Reconciliations Revenue Schedules API
  description: API for managing cash positions, bank accounts, transactions, and cash forecasting within Workday Cash Management.
  version: v38.2
  contact:
    name: Workday Support
    url: https://www.workday.com/en-us/company/latest/support.html
  termsOfService: https://www.workday.com/en-us/legal.html
servers:
- url: https://{tenant}.workday.com/api/cashManagement/v38.2
  description: Workday Cash Management Production
  variables:
    tenant:
      description: Workday tenant identifier
      default: your-tenant
security:
- bearerAuth: []
tags:
- name: Revenue Schedules
  description: Access and manage revenue recognition schedules
paths:
  /revenueSchedules:
    get:
      operationId: listRevenueSchedules
      summary: Workday Financials List revenue schedules
      description: Retrieve a collection of revenue recognition schedules.
      tags:
      - Revenue Schedules
      parameters:
      - $ref: '#/components/parameters/limit'
      - $ref: '#/components/parameters/offset'
      responses:
        '200':
          description: Revenue schedules retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  total:
                    type: integer
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/RevenueSchedule'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /revenueSchedules/{id}:
    get:
      operationId: getRevenueSchedule
      summary: Workday Financials Get a revenue schedule
      description: Retrieve details of a specific revenue recognition schedule.
      tags:
      - Revenue Schedules
      parameters:
      - $ref: '#/components/parameters/resourceId'
      responses:
        '200':
          description: Revenue schedule details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RevenueSchedule'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
components:
  schemas:
    RevenueSchedule:
      type: object
      properties:
        id:
          type: string
          description: Workday ID (WID) for the revenue schedule
        revenueContract:
          $ref: '#/components/schemas/ContractRef'
        scheduledDate:
          type: string
          format: date
          description: Scheduled recognition date
        amount:
          type: number
          format: double
          description: Revenue amount to be recognized
        currency:
          $ref: '#/components/schemas/CurrencyRef'
        status:
          type: string
          enum:
          - Scheduled
          - Recognized
          - Reversed
          description: Schedule status
    CurrencyRef:
      type: object
      properties:
        id:
          type: string
          description: Workday ID of the currency
        descriptor:
          type: string
          description: Currency code (e.g., USD, EUR)
    ContractRef:
      type: object
      properties:
        id:
          type: string
          description: Workday ID of the revenue contract
        descriptor:
          type: string
          description: Display name of the contract
  parameters:
    offset:
      name: offset
      in: query
      description: Number of results to skip for pagination
      schema:
        type: integer
        default: 0
    resourceId:
      name: id
      in: path
      required: true
      description: Unique identifier of the resource (WID)
      schema:
        type: string
    limit:
      name: limit
      in: query
      description: Maximum number of results to return
      schema:
        type: integer
        default: 20
        maximum: 100
  responses:
    Unauthorized:
      description: Authentication credentials are missing or invalid
    NotFound:
      description: The requested resource was not found
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: OAuth 2.0 bearer token obtained from Workday authentication
externalDocs:
  description: Workday Cash Management API Documentation
  url: https://community.workday.com/sites/default/files/file-hosting/productionapi/index.html
