openapi: 3.2.0
info:
  title: Workday Financials Workday Expenses Expense Policies API
  description: API for expense report submission, approval workflows, receipt management, and expense policy enforcement within Workday Expense Management.
  version: v38.2
  contact:
    name: Workday Support
    url: https://www.workday.com/en-us/company/latest/support.html
  termsOfService: https://www.workday.com/en-us/legal.html
servers:
- url: https://{tenant}.workday.com/api/expenses/v38.2
  description: Workday Expenses Production
  variables:
    tenant:
      description: Workday tenant identifier
      default: your-tenant
security:
- bearerAuth: []
tags:
- name: Expense Policies
  description: Access expense policy configurations
paths:
  /expensePolicies:
    get:
      operationId: listExpensePolicies
      summary: Workday Financials List expense policies
      description: Retrieve a collection of expense policies.
      tags:
      - Expense Policies
      parameters:
      - $ref: '#/components/parameters/limit'
      - $ref: '#/components/parameters/offset'
      responses:
        '200':
          description: Expense policies retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  total:
                    type: integer
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/ExpensePolicy'
        '401':
          $ref: '#/components/responses/Unauthorized'
components:
  schemas:
    ExpensePolicy:
      type: object
      properties:
        id:
          type: string
          description: Workday ID (WID) for the expense policy
        name:
          type: string
          description: Expense policy name
        description:
          type: string
          description: Policy description
        active:
          type: boolean
          description: Whether the policy is currently active
        maxAmount:
          type: number
          format: double
          description: Maximum allowable amount per expense
        requiresReceipt:
          type: boolean
          description: Whether receipts are required
  responses:
    Unauthorized:
      description: Authentication credentials are missing or invalid
  parameters:
    limit:
      name: limit
      in: query
      description: Maximum number of results to return
      schema:
        type: integer
        default: 20
        maximum: 100
    offset:
      name: offset
      in: query
      description: Number of results to skip for pagination
      schema:
        type: integer
        default: 0
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: OAuth 2.0 bearer token obtained from Workday authentication
externalDocs:
  description: Workday Expenses API Documentation
  url: https://community.workday.com/sites/default/files/file-hosting/productionapi/index.html
