openapi: 3.1.0
info:
  title: Workday Financials Workday Cash Management Account Reconciliations Audit Logs API
  description: API for managing cash positions, bank accounts, transactions, and cash forecasting within Workday Cash Management.
  version: v38.2
  contact:
    name: Workday Support
    url: https://www.workday.com/en-us/company/latest/support.html
  termsOfService: https://www.workday.com/en-us/legal.html
servers:
- url: https://{tenant}.workday.com/api/cashManagement/v38.2
  description: Workday Cash Management Production
  variables:
    tenant:
      description: Workday tenant identifier
      default: your-tenant
security:
- bearerAuth: []
tags:
- name: Audit Logs
  description: Access financial audit trail data
paths:
  /auditLogs:
    get:
      operationId: listAuditLogs
      summary: Workday Financials List audit logs
      description: Retrieve financial audit trail entries.
      tags:
      - Audit Logs
      parameters:
      - $ref: '#/components/parameters/limit'
      - $ref: '#/components/parameters/offset'
      - name: fromDate
        in: query
        description: Filter logs from this date
        schema:
          type: string
          format: date-time
      - name: toDate
        in: query
        description: Filter logs to this date
        schema:
          type: string
          format: date-time
      - name: eventType
        in: query
        description: Filter by event type
        schema:
          type: string
      responses:
        '200':
          description: Audit logs retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  total:
                    type: integer
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/AuditLogEntry'
        '401':
          $ref: '#/components/responses/Unauthorized'
components:
  schemas:
    AuditLogEntry:
      type: object
      properties:
        id:
          type: string
          description: Workday ID (WID) for the audit log entry
        eventType:
          type: string
          description: Type of audit event
        eventDate:
          type: string
          format: date-time
          description: When the event occurred
        user:
          $ref: '#/components/schemas/WorkerRef'
        resourceType:
          type: string
          description: Type of resource affected
        resourceId:
          type: string
          description: ID of the affected resource
        description:
          type: string
          description: Description of the audit event
        previousValue:
          type: string
          description: Previous value (for change events)
        newValue:
          type: string
          description: New value (for change events)
    WorkerRef:
      type: object
      properties:
        id:
          type: string
          description: Workday ID of the worker
        descriptor:
          type: string
          description: Display name of the worker
  parameters:
    offset:
      name: offset
      in: query
      description: Number of results to skip for pagination
      schema:
        type: integer
        default: 0
    limit:
      name: limit
      in: query
      description: Maximum number of results to return
      schema:
        type: integer
        default: 20
        maximum: 100
  responses:
    Unauthorized:
      description: Authentication credentials are missing or invalid
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: OAuth 2.0 bearer token obtained from Workday authentication
externalDocs:
  description: Workday Cash Management API Documentation
  url: https://community.workday.com/sites/default/files/file-hosting/productionapi/index.html
