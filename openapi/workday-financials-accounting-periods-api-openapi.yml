openapi: 3.1.0
info:
  title: Workday Financials Workday Cash Management Account Reconciliations Accounting Periods API
  description: API for managing cash positions, bank accounts, transactions, and cash forecasting within Workday Cash Management.
  version: v38.2
  contact:
    name: Workday Support
    url: https://www.workday.com/en-us/company/latest/support.html
  termsOfService: https://www.workday.com/en-us/legal.html
servers:
- url: https://{tenant}.workday.com/api/cashManagement/v38.2
  description: Workday Cash Management Production
  variables:
    tenant:
      description: Workday tenant identifier
      default: your-tenant
security:
- bearerAuth: []
tags:
- name: Accounting Periods
  description: Manage accounting periods and period close
paths:
  /accountingPeriods:
    get:
      operationId: listAccountingPeriods
      summary: Workday Financials List accounting periods
      description: Retrieve a collection of accounting periods.
      tags:
      - Accounting Periods
      parameters:
      - $ref: '#/components/parameters/limit'
      - $ref: '#/components/parameters/offset'
      responses:
        '200':
          description: Accounting periods retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  total:
                    type: integer
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/AccountingPeriod'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /accountingPeriods/{id}:
    get:
      operationId: getAccountingPeriod
      summary: Workday Financials Get an accounting period
      description: Retrieve details of a specific accounting period.
      tags:
      - Accounting Periods
      parameters:
      - $ref: '#/components/parameters/resourceId'
      responses:
        '200':
          description: Accounting period details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountingPeriod'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /accountingPeriods/{id}/close:
    post:
      operationId: closeAccountingPeriod
      summary: Workday Financials Close an accounting period
      description: Close an open accounting period, preventing further postings.
      tags:
      - Accounting Periods
      parameters:
      - $ref: '#/components/parameters/resourceId'
      responses:
        '200':
          description: Accounting period closed successfully
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Period is not in a valid state for closing
components:
  parameters:
    offset:
      name: offset
      in: query
      description: Number of results to skip for pagination
      schema:
        type: integer
        default: 0
    resourceId:
      name: id
      in: path
      required: true
      description: Unique identifier of the resource (WID)
      schema:
        type: string
    limit:
      name: limit
      in: query
      description: Maximum number of results to return
      schema:
        type: integer
        default: 20
        maximum: 100
  responses:
    Unauthorized:
      description: Authentication credentials are missing or invalid
    NotFound:
      description: The requested resource was not found
  schemas:
    CompanyRef:
      type: object
      properties:
        id:
          type: string
          description: Workday ID of the company
        descriptor:
          type: string
          description: Display name of the company
    AccountingPeriod:
      type: object
      properties:
        id:
          type: string
          description: Workday ID (WID) for the accounting period
        name:
          type: string
          description: Period name (e.g., January 2026)
        startDate:
          type: string
          format: date
          description: Period start date
        endDate:
          type: string
          format: date
          description: Period end date
        status:
          type: string
          enum:
          - Open
          - Closed
          - Locked
          description: Period status
        fiscalYear:
          type: string
          description: Fiscal year reference
        company:
          $ref: '#/components/schemas/CompanyRef'
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: OAuth 2.0 bearer token obtained from Workday authentication
externalDocs:
  description: Workday Cash Management API Documentation
  url: https://community.workday.com/sites/default/files/file-hosting/productionapi/index.html
