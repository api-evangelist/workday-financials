openapi: 3.1.0
info:
  title: Workday Financials Workday Cash Management Account Reconciliations Cost Centers API
  description: API for managing cash positions, bank accounts, transactions, and cash forecasting within Workday Cash Management.
  version: v38.2
  contact:
    name: Workday Support
    url: https://www.workday.com/en-us/company/latest/support.html
  termsOfService: https://www.workday.com/en-us/legal.html
servers:
- url: https://{tenant}.workday.com/api/cashManagement/v38.2
  description: Workday Cash Management Production
  variables:
    tenant:
      description: Workday tenant identifier
      default: your-tenant
security:
- bearerAuth: []
tags:
- name: Cost Centers
  description: Manage cost centers for financial allocation
paths:
  /costCenters:
    get:
      operationId: listCostCenters
      summary: Workday Financials List cost centers
      description: Retrieve a collection of cost centers.
      tags:
      - Cost Centers
      parameters:
      - $ref: '#/components/parameters/limit'
      - $ref: '#/components/parameters/offset'
      responses:
        '200':
          description: Cost centers retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  total:
                    type: integer
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/CostCenter'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /costCenters/{id}:
    get:
      operationId: getCostCenter
      summary: Workday Financials Get a cost center
      description: Retrieve details of a specific cost center.
      tags:
      - Cost Centers
      parameters:
      - $ref: '#/components/parameters/resourceId'
      responses:
        '200':
          description: Cost center details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CostCenter'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
components:
  schemas:
    CostCenter:
      type: object
      properties:
        id:
          type: string
          description: Workday ID (WID) for the cost center
        name:
          type: string
          description: Cost center name
        code:
          type: string
          description: Cost center reference code
        active:
          type: boolean
          description: Whether the cost center is active
        manager:
          type: object
          properties:
            id:
              type: string
            name:
              type: string
          description: Cost center manager reference
  parameters:
    offset:
      name: offset
      in: query
      description: Number of results to skip for pagination
      schema:
        type: integer
        default: 0
    resourceId:
      name: id
      in: path
      required: true
      description: Unique identifier of the resource (WID)
      schema:
        type: string
    limit:
      name: limit
      in: query
      description: Maximum number of results to return
      schema:
        type: integer
        default: 20
        maximum: 100
  responses:
    Unauthorized:
      description: Authentication credentials are missing or invalid
    NotFound:
      description: The requested resource was not found
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: OAuth 2.0 bearer token obtained from Workday authentication
externalDocs:
  description: Workday Cash Management API Documentation
  url: https://community.workday.com/sites/default/files/file-hosting/productionapi/index.html
