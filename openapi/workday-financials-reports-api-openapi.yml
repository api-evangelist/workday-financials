openapi: 3.1.0
info:
  title: Workday Financials Workday Cash Management Account Reconciliations Reports API
  description: API for managing cash positions, bank accounts, transactions, and cash forecasting within Workday Cash Management.
  version: v38.2
  contact:
    name: Workday Support
    url: https://www.workday.com/en-us/company/latest/support.html
  termsOfService: https://www.workday.com/en-us/legal.html
servers:
- url: https://{tenant}.workday.com/api/cashManagement/v38.2
  description: Workday Cash Management Production
  variables:
    tenant:
      description: Workday tenant identifier
      default: your-tenant
security:
- bearerAuth: []
tags:
- name: Reports
  description: Access and manage report definitions
paths:
  /reports:
    get:
      operationId: listReports
      summary: Workday Financials List available reports
      description: Retrieve a collection of available report definitions.
      tags:
      - Reports
      parameters:
      - $ref: '#/components/parameters/limit'
      - $ref: '#/components/parameters/offset'
      - name: category
        in: query
        description: Filter by report category
        schema:
          type: string
      responses:
        '200':
          description: Reports retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  total:
                    type: integer
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/ReportDefinition'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /reports/{id}:
    get:
      operationId: getReport
      summary: Workday Financials Get a report definition
      description: Retrieve the definition and metadata for a specific report.
      tags:
      - Reports
      parameters:
      - $ref: '#/components/parameters/resourceId'
      responses:
        '200':
          description: Report definition details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportDefinition'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
components:
  parameters:
    offset:
      name: offset
      in: query
      description: Number of results to skip for pagination
      schema:
        type: integer
        default: 0
    resourceId:
      name: id
      in: path
      required: true
      description: Unique identifier of the resource (WID)
      schema:
        type: string
    limit:
      name: limit
      in: query
      description: Maximum number of results to return
      schema:
        type: integer
        default: 20
        maximum: 100
  responses:
    Unauthorized:
      description: Authentication credentials are missing or invalid
    NotFound:
      description: The requested resource was not found
  schemas:
    WorkerRef:
      type: object
      properties:
        id:
          type: string
          description: Workday ID of the worker
        descriptor:
          type: string
          description: Display name of the worker
    ReportDefinition:
      type: object
      properties:
        id:
          type: string
          description: Workday ID (WID) for the report
        name:
          type: string
          description: Report name
        description:
          type: string
          description: Report description
        category:
          type: string
          description: Report category
        outputFormat:
          type: array
          items:
            type: string
            enum:
            - json
            - csv
            - xml
          description: Supported output formats
        hasPrompts:
          type: boolean
          description: Whether the report requires prompt values
        owner:
          $ref: '#/components/schemas/WorkerRef'
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: OAuth 2.0 bearer token obtained from Workday authentication
externalDocs:
  description: Workday Cash Management API Documentation
  url: https://community.workday.com/sites/default/files/file-hosting/productionapi/index.html
