openapi: 3.1.0
info:
  title: Workday Financials Workday Cash Management Account Reconciliations Cash Forecasts API
  description: API for managing cash positions, bank accounts, transactions, and cash forecasting within Workday Cash Management.
  version: v38.2
  contact:
    name: Workday Support
    url: https://www.workday.com/en-us/company/latest/support.html
  termsOfService: https://www.workday.com/en-us/legal.html
servers:
- url: https://{tenant}.workday.com/api/cashManagement/v38.2
  description: Workday Cash Management Production
  variables:
    tenant:
      description: Workday tenant identifier
      default: your-tenant
security:
- bearerAuth: []
tags:
- name: Cash Forecasts
  description: Access cash forecasting data
paths:
  /cashForecasts:
    get:
      operationId: listCashForecasts
      summary: Workday Financials List cash forecasts
      description: Retrieve cash forecast projections.
      tags:
      - Cash Forecasts
      parameters:
      - $ref: '#/components/parameters/limit'
      - $ref: '#/components/parameters/offset'
      - name: forecastDate
        in: query
        description: Forecast for this date
        schema:
          type: string
          format: date
      responses:
        '200':
          description: Cash forecasts retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  total:
                    type: integer
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/CashForecast'
        '401':
          $ref: '#/components/responses/Unauthorized'
components:
  parameters:
    offset:
      name: offset
      in: query
      description: Number of results to skip for pagination
      schema:
        type: integer
        default: 0
    limit:
      name: limit
      in: query
      description: Maximum number of results to return
      schema:
        type: integer
        default: 20
        maximum: 100
  schemas:
    CurrencyRef:
      type: object
      properties:
        id:
          type: string
          description: Workday ID of the currency
        descriptor:
          type: string
          description: Currency code (e.g., USD, EUR)
    CompanyRef:
      type: object
      properties:
        id:
          type: string
          description: Workday ID of the company
        descriptor:
          type: string
          description: Display name of the company
    CashForecast:
      type: object
      properties:
        id:
          type: string
          description: Workday ID (WID) for the forecast
        forecastDate:
          type: string
          format: date
          description: Forecast date
        projectedInflows:
          type: number
          format: double
          description: Projected cash inflows
        projectedOutflows:
          type: number
          format: double
          description: Projected cash outflows
        projectedBalance:
          type: number
          format: double
          description: Projected ending balance
        currency:
          $ref: '#/components/schemas/CurrencyRef'
        company:
          $ref: '#/components/schemas/CompanyRef'
  responses:
    Unauthorized:
      description: Authentication credentials are missing or invalid
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: OAuth 2.0 bearer token obtained from Workday authentication
externalDocs:
  description: Workday Cash Management API Documentation
  url: https://community.workday.com/sites/default/files/file-hosting/productionapi/index.html
