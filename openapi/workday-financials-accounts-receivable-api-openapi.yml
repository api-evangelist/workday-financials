openapi: 3.1.0
info:
  title: Workday Financials Workday Cash Management Account Reconciliations Accounts Receivable API
  description: API for managing cash positions, bank accounts, transactions, and cash forecasting within Workday Cash Management.
  version: v38.2
  contact:
    name: Workday Support
    url: https://www.workday.com/en-us/company/latest/support.html
  termsOfService: https://www.workday.com/en-us/legal.html
servers:
- url: https://{tenant}.workday.com/api/cashManagement/v38.2
  description: Workday Cash Management Production
  variables:
    tenant:
      description: Workday tenant identifier
      default: your-tenant
security:
- bearerAuth: []
tags:
- name: Accounts Receivable
  description: Manage customer invoices and receivables
paths:
  /customerInvoices:
    get:
      operationId: listCustomerInvoices
      summary: Workday Financials List customer invoices
      description: Retrieve a collection of customer invoices for accounts receivable.
      tags:
      - Accounts Receivable
      parameters:
      - $ref: '#/components/parameters/limit'
      - $ref: '#/components/parameters/offset'
      - name: status
        in: query
        description: Filter invoices by status
        schema:
          type: string
          enum:
          - Draft
          - Approved
          - Paid
          - Overdue
          - Canceled
      responses:
        '200':
          description: Customer invoices retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  total:
                    type: integer
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/CustomerInvoice'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /customerInvoices/{id}:
    get:
      operationId: getCustomerInvoice
      summary: Workday Financials Get a customer invoice
      description: Retrieve details of a specific customer invoice.
      tags:
      - Accounts Receivable
      parameters:
      - $ref: '#/components/parameters/resourceId'
      responses:
        '200':
          description: Customer invoice details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerInvoice'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
components:
  parameters:
    offset:
      name: offset
      in: query
      description: Number of results to skip for pagination
      schema:
        type: integer
        default: 0
    resourceId:
      name: id
      in: path
      required: true
      description: Unique identifier of the resource (WID)
      schema:
        type: string
    limit:
      name: limit
      in: query
      description: Maximum number of results to return
      schema:
        type: integer
        default: 20
        maximum: 100
  schemas:
    CurrencyRef:
      type: object
      properties:
        id:
          type: string
          description: Workday ID of the currency
        descriptor:
          type: string
          description: Currency code (e.g., USD, EUR)
    CompanyRef:
      type: object
      properties:
        id:
          type: string
          description: Workday ID of the company
        descriptor:
          type: string
          description: Display name of the company
    CustomerInvoice:
      type: object
      properties:
        id:
          type: string
          description: Workday ID (WID) for the customer invoice
        invoiceNumber:
          type: string
          description: Invoice number
        customer:
          $ref: '#/components/schemas/CustomerRef'
        invoiceDate:
          type: string
          format: date
          description: Date on the invoice
        dueDate:
          type: string
          format: date
          description: Payment due date
        totalAmount:
          type: number
          format: double
          description: Total invoice amount
        currency:
          $ref: '#/components/schemas/CurrencyRef'
        status:
          type: string
          enum:
          - Draft
          - Approved
          - Paid
          - Overdue
          - Canceled
          description: Current invoice status
        company:
          $ref: '#/components/schemas/CompanyRef'
    CustomerRef:
      type: object
      properties:
        id:
          type: string
          description: Workday ID of the customer
        descriptor:
          type: string
          description: Display name of the customer
  responses:
    Unauthorized:
      description: Authentication credentials are missing or invalid
    NotFound:
      description: The requested resource was not found
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: OAuth 2.0 bearer token obtained from Workday authentication
externalDocs:
  description: Workday Cash Management API Documentation
  url: https://community.workday.com/sites/default/files/file-hosting/productionapi/index.html
