openapi: 3.1.0
info:
  title: Workday Financials Workday Cash Management Account Reconciliations Custom Reports API
  description: API for managing cash positions, bank accounts, transactions, and cash forecasting within Workday Cash Management.
  version: v38.2
  contact:
    name: Workday Support
    url: https://www.workday.com/en-us/company/latest/support.html
  termsOfService: https://www.workday.com/en-us/legal.html
servers:
- url: https://{tenant}.workday.com/api/cashManagement/v38.2
  description: Workday Cash Management Production
  variables:
    tenant:
      description: Workday tenant identifier
      default: your-tenant
security:
- bearerAuth: []
tags:
- name: Custom Reports
  description: Manage custom report definitions
paths:
  /customReports:
    get:
      operationId: listCustomReports
      summary: Workday Financials List custom reports
      description: Retrieve a collection of custom report definitions.
      tags:
      - Custom Reports
      parameters:
      - $ref: '#/components/parameters/limit'
      - $ref: '#/components/parameters/offset'
      responses:
        '200':
          description: Custom reports retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  total:
                    type: integer
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/CustomReport'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /customReports/{id}:
    get:
      operationId: getCustomReport
      summary: Workday Financials Get a custom report
      description: Retrieve details of a specific custom report definition.
      tags:
      - Custom Reports
      parameters:
      - $ref: '#/components/parameters/resourceId'
      responses:
        '200':
          description: Custom report details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomReport'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /customReports/{id}/execute:
    post:
      operationId: executeCustomReport
      summary: Workday Financials Execute a custom report
      description: Execute a custom report with optional prompt values and retrieve results.
      tags:
      - Custom Reports
      parameters:
      - $ref: '#/components/parameters/resourceId'
      - name: format
        in: query
        description: Output format for the report
        schema:
          type: string
          enum:
          - json
          - csv
          - xml
          default: json
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReportExecutionRequest'
      responses:
        '200':
          description: Custom report executed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
components:
  responses:
    BadRequest:
      description: The request was malformed or contained invalid data
    Unauthorized:
      description: Authentication credentials are missing or invalid
    NotFound:
      description: The requested resource was not found
  schemas:
    ReportColumn:
      type: object
      properties:
        name:
          type: string
          description: Column name
        label:
          type: string
          description: Column display label
        dataType:
          type: string
          enum:
          - text
          - numeric
          - date
          - boolean
          - currency
          description: Data type of the column
    ReportResult:
      type: object
      properties:
        reportName:
          type: string
          description: Name of the executed report
        executedOn:
          type: string
          format: date-time
          description: When the report was executed
        totalRows:
          type: integer
          description: Total number of rows in the result
        columns:
          type: array
          items:
            $ref: '#/components/schemas/ReportColumn'
          description: Column definitions
        rows:
          type: array
          items:
            type: object
            additionalProperties: true
          description: Report data rows
    ReportExecutionRequest:
      type: object
      properties:
        prompts:
          type: object
          additionalProperties:
            type: string
          description: Key-value pairs of prompt parameter names and values
    WorkerRef:
      type: object
      properties:
        id:
          type: string
          description: Workday ID of the worker
        descriptor:
          type: string
          description: Display name of the worker
    CustomReport:
      type: object
      properties:
        id:
          type: string
          description: Workday ID (WID) for the custom report
        name:
          type: string
          description: Custom report name
        description:
          type: string
          description: Custom report description
        dataSource:
          type: string
          description: Data source for the report
        columns:
          type: array
          items:
            $ref: '#/components/schemas/ReportColumn'
          description: Report columns
        owner:
          $ref: '#/components/schemas/WorkerRef'
        createdOn:
          type: string
          format: date-time
          description: When the custom report was created
  parameters:
    offset:
      name: offset
      in: query
      description: Number of results to skip for pagination
      schema:
        type: integer
        default: 0
    resourceId:
      name: id
      in: path
      required: true
      description: Unique identifier of the resource (WID)
      schema:
        type: string
    limit:
      name: limit
      in: query
      description: Maximum number of results to return
      schema:
        type: integer
        default: 20
        maximum: 100
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: OAuth 2.0 bearer token obtained from Workday authentication
externalDocs:
  description: Workday Cash Management API Documentation
  url: https://community.workday.com/sites/default/files/file-hosting/productionapi/index.html
