openapi: 3.2.0
info:
  title: Workday Financials Workday Financial Accounting Trial…
  description: API for journal entries, account reconciliation, period close activities, and audit trails within Workday Financial Accounting.
  version: v38.2
  contact:
    name: Workday Support
    url: https://www.workday.com/en-us/company/latest/support.html
  termsOfService: https://www.workday.com/en-us/legal.html
servers:
- url: https://{tenant}.workday.com/api/financialAccounting/v38.2
  description: Workday Financial Accounting Production
  variables:
    tenant:
      description: Workday tenant identifier
      default: your-tenant
security:
- bearerAuth: []
tags:
- name: Trial Balances
  description: Access trial balance data
paths:
  /trialBalances:
    get:
      operationId: listTrialBalances
      summary: Workday Financials List trial balances
      description: Retrieve trial balance data for specified periods.
      tags:
      - Trial Balances
      parameters:
      - $ref: '#/components/parameters/limit'
      - $ref: '#/components/parameters/offset'
      - name: period
        in: query
        description: Accounting period identifier
        schema:
          type: string
      responses:
        '200':
          description: Trial balances retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  total:
                    type: integer
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/TrialBalanceEntry'
        '401':
          $ref: '#/components/responses/Unauthorized'
components:
  schemas:
    TrialBalanceEntry:
      type: object
      properties:
        id:
          type: string
          description: Workday ID (WID) for the trial balance entry
        ledgerAccount:
          $ref: '#/components/schemas/LedgerAccountRef'
        accountingPeriod:
          $ref: '#/components/schemas/PeriodRef'
        debitBalance:
          type: number
          format: double
          description: Debit balance amount
        creditBalance:
          type: number
          format: double
          description: Credit balance amount
        netBalance:
          type: number
          format: double
          description: Net balance amount
        currency:
          $ref: '#/components/schemas/CurrencyRef'
    LedgerAccountRef:
      type: object
      properties:
        id:
          type: string
          description: Workday ID of the ledger account
        descriptor:
          type: string
          description: Display name of the ledger account
    PeriodRef:
      type: object
      properties:
        id:
          type: string
          description: Workday ID of the accounting period
        descriptor:
          type: string
          description: Display name of the period
    CurrencyRef:
      type: object
      properties:
        id:
          type: string
          description: Workday ID of the currency
        descriptor:
          type: string
          description: Currency code (e.g., USD, EUR)
  parameters:
    limit:
      name: limit
      in: query
      description: Maximum number of results to return
      schema:
        type: integer
        default: 20
        maximum: 100
    offset:
      name: offset
      in: query
      description: Number of results to skip for pagination
      schema:
        type: integer
        default: 0
  responses:
    Unauthorized:
      description: Authentication credentials are missing or invalid
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: OAuth 2.0 bearer token obtained from Workday authentication
externalDocs:
  description: Workday Financial Accounting API Documentation
  url: https://community.workday.com/sites/default/files/file-hosting/productionapi/index.html
