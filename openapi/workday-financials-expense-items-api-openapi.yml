openapi: 3.2.0
info:
  title: Workday Financials Workday Expenses Expense Items API
  description: API for expense report submission, approval workflows, receipt management, and expense policy enforcement within Workday Expense Management.
  version: v38.2
  contact:
    name: Workday Support
    url: https://www.workday.com/en-us/company/latest/support.html
  termsOfService: https://www.workday.com/en-us/legal.html
servers:
- url: https://{tenant}.workday.com/api/expenses/v38.2
  description: Workday Expenses Production
  variables:
    tenant:
      description: Workday tenant identifier
      default: your-tenant
security:
- bearerAuth: []
tags:
- name: Expense Items
  description: Manage individual expense line items
paths:
  /expenseReports/{id}/expenseItems:
    get:
      operationId: listExpenseItems
      summary: Workday Financials List expense items for a report
      description: Retrieve expense line items for a specific expense report.
      tags:
      - Expense Items
      parameters:
      - $ref: '#/components/parameters/resourceId'
      responses:
        '200':
          description: Expense items retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  total:
                    type: integer
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/ExpenseItem'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      operationId: addExpenseItem
      summary: Workday Financials Add an expense item to a report
      description: Add a new expense line item to an existing expense report.
      tags:
      - Expense Items
      parameters:
      - $ref: '#/components/parameters/resourceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExpenseItemCreate'
      responses:
        '201':
          description: Expense item added successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExpenseItem'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
components:
  schemas:
    ReceiptRef:
      type: object
      properties:
        id:
          type: string
          description: Workday ID of the receipt
        descriptor:
          type: string
          description: Display name of the receipt
    ExpenseItem:
      type: object
      properties:
        id:
          type: string
          description: Workday ID (WID) for the expense item
        expenseItemType:
          type: string
          description: Type of expense (e.g., Airfare, Hotel, Meals)
        amount:
          type: number
          format: double
          description: Expense amount
        currency:
          $ref: '#/components/schemas/CurrencyRef'
        date:
          type: string
          format: date
          description: Date the expense was incurred
        memo:
          type: string
          description: Description of the expense
        receipt:
          $ref: '#/components/schemas/ReceiptRef'
        costCenter:
          $ref: '#/components/schemas/CostCenterRef'
    ExpenseItemCreate:
      type: object
      required:
      - expenseItemType
      - amount
      - date
      properties:
        expenseItemType:
          type: string
          description: Type of expense
        amount:
          type: number
          format: double
          description: Expense amount
        currency:
          $ref: '#/components/schemas/CurrencyRef'
        date:
          type: string
          format: date
          description: Date the expense was incurred
        memo:
          type: string
          description: Description of the expense
        receipt:
          $ref: '#/components/schemas/ReceiptRef'
    CostCenterRef:
      type: object
      properties:
        id:
          type: string
          description: Workday ID of the cost center
        descriptor:
          type: string
          description: Display name of the cost center
    CurrencyRef:
      type: object
      properties:
        id:
          type: string
          description: Workday ID of the currency
        descriptor:
          type: string
          description: Currency code (e.g., USD, EUR)
  responses:
    Unauthorized:
      description: Authentication credentials are missing or invalid
    NotFound:
      description: The requested resource was not found
    BadRequest:
      description: The request was malformed or contained invalid data
  parameters:
    resourceId:
      name: id
      in: path
      required: true
      description: Unique identifier of the resource (WID)
      schema:
        type: string
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: OAuth 2.0 bearer token obtained from Workday authentication
externalDocs:
  description: Workday Expenses API Documentation
  url: https://community.workday.com/sites/default/files/file-hosting/productionapi/index.html
