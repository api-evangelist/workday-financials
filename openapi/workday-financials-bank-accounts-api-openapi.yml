openapi: 3.1.0
info:
  title: Workday Financials Workday Cash Management Account Reconciliations Bank Accounts API
  description: API for managing cash positions, bank accounts, transactions, and cash forecasting within Workday Cash Management.
  version: v38.2
  contact:
    name: Workday Support
    url: https://www.workday.com/en-us/company/latest/support.html
  termsOfService: https://www.workday.com/en-us/legal.html
servers:
- url: https://{tenant}.workday.com/api/cashManagement/v38.2
  description: Workday Cash Management Production
  variables:
    tenant:
      description: Workday tenant identifier
      default: your-tenant
security:
- bearerAuth: []
tags:
- name: Bank Accounts
  description: Manage bank accounts
paths:
  /bankAccounts:
    get:
      operationId: listBankAccounts
      summary: Workday Financials List bank accounts
      description: Retrieve a collection of bank accounts.
      tags:
      - Bank Accounts
      parameters:
      - $ref: '#/components/parameters/limit'
      - $ref: '#/components/parameters/offset'
      - name: active
        in: query
        description: Filter by active status
        schema:
          type: boolean
      responses:
        '200':
          description: Bank accounts retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  total:
                    type: integer
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/BankAccount'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /bankAccounts/{id}:
    get:
      operationId: getBankAccount
      summary: Workday Financials Get a bank account
      description: Retrieve details of a specific bank account.
      tags:
      - Bank Accounts
      parameters:
      - $ref: '#/components/parameters/resourceId'
      responses:
        '200':
          description: Bank account details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BankAccount'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
components:
  parameters:
    offset:
      name: offset
      in: query
      description: Number of results to skip for pagination
      schema:
        type: integer
        default: 0
    resourceId:
      name: id
      in: path
      required: true
      description: Unique identifier of the resource (WID)
      schema:
        type: string
    limit:
      name: limit
      in: query
      description: Maximum number of results to return
      schema:
        type: integer
        default: 20
        maximum: 100
  schemas:
    CurrencyRef:
      type: object
      properties:
        id:
          type: string
          description: Workday ID of the currency
        descriptor:
          type: string
          description: Currency code (e.g., USD, EUR)
    BankAccount:
      type: object
      properties:
        id:
          type: string
          description: Workday ID (WID) for the bank account
        accountName:
          type: string
          description: Name of the bank account
        accountNumber:
          type: string
          description: Bank account number (masked)
        bankName:
          type: string
          description: Name of the financial institution
        routingNumber:
          type: string
          description: Bank routing number
        accountType:
          type: string
          enum:
          - Checking
          - Savings
          - MoneyMarket
          - Investment
          description: Type of bank account
        currency:
          $ref: '#/components/schemas/CurrencyRef'
        currentBalance:
          type: number
          format: double
          description: Current account balance
        active:
          type: boolean
          description: Whether the account is active
        company:
          $ref: '#/components/schemas/CompanyRef'
    CompanyRef:
      type: object
      properties:
        id:
          type: string
          description: Workday ID of the company
        descriptor:
          type: string
          description: Display name of the company
  responses:
    Unauthorized:
      description: Authentication credentials are missing or invalid
    NotFound:
      description: The requested resource was not found
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: OAuth 2.0 bearer token obtained from Workday authentication
externalDocs:
  description: Workday Cash Management API Documentation
  url: https://community.workday.com/sites/default/files/file-hosting/productionapi/index.html
