openapi: 3.2.0
info:
  title: Workday Financials Workday Revenue Management Billing…
  description: API for managing revenue recognition, contracts, billing, and revenue accounting in compliance with ASC 606 and IFRS 15 within Workday Revenue Management.
  version: v38.2
  contact:
    name: Workday Support
    url: https://www.workday.com/en-us/company/latest/support.html
  termsOfService: https://www.workday.com/en-us/legal.html
servers:
- url: https://{tenant}.workday.com/api/revenueManagement/v38.2
  description: Workday Revenue Management Production
  variables:
    tenant:
      description: Workday tenant identifier
      default: your-tenant
security:
- bearerAuth: []
tags:
- name: Billing Schedules
  description: Manage billing schedules and invoice generation
paths:
  /billingSchedules:
    get:
      operationId: listBillingSchedules
      summary: Workday Financials List billing schedules
      description: Retrieve a collection of billing schedules.
      tags:
      - Billing Schedules
      parameters:
      - $ref: '#/components/parameters/limit'
      - $ref: '#/components/parameters/offset'
      responses:
        '200':
          description: Billing schedules retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  total:
                    type: integer
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/BillingSchedule'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /billingSchedules/{id}:
    get:
      operationId: getBillingSchedule
      summary: Workday Financials Get a billing schedule
      description: Retrieve details of a specific billing schedule.
      tags:
      - Billing Schedules
      parameters:
      - $ref: '#/components/parameters/resourceId'
      responses:
        '200':
          description: Billing schedule details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BillingSchedule'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
components:
  parameters:
    limit:
      name: limit
      in: query
      description: Maximum number of results to return
      schema:
        type: integer
        default: 20
        maximum: 100
    offset:
      name: offset
      in: query
      description: Number of results to skip for pagination
      schema:
        type: integer
        default: 0
    resourceId:
      name: id
      in: path
      required: true
      description: Unique identifier of the resource (WID)
      schema:
        type: string
  schemas:
    BillingSchedule:
      type: object
      properties:
        id:
          type: string
          description: Workday ID (WID) for the billing schedule
        revenueContract:
          $ref: '#/components/schemas/ContractRef'
        billingDate:
          type: string
          format: date
          description: Scheduled billing date
        amount:
          type: number
          format: double
          description: Billing amount
        currency:
          $ref: '#/components/schemas/CurrencyRef'
        status:
          type: string
          enum:
          - Scheduled
          - Invoiced
          - Canceled
          description: Billing schedule status
    ContractRef:
      type: object
      properties:
        id:
          type: string
          description: Workday ID of the revenue contract
        descriptor:
          type: string
          description: Display name of the contract
    CurrencyRef:
      type: object
      properties:
        id:
          type: string
          description: Workday ID of the currency
        descriptor:
          type: string
          description: Currency code (e.g., USD, EUR)
  responses:
    Unauthorized:
      description: Authentication credentials are missing or invalid
    NotFound:
      description: The requested resource was not found
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: OAuth 2.0 bearer token obtained from Workday authentication
externalDocs:
  description: Workday Revenue Management API Documentation
  url: https://community.workday.com/sites/default/files/file-hosting/productionapi/index.html
